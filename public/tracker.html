<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OB Form Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/dole-bicol-logo.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tracker-page.css">
  <link rel="stylesheet" href="css/tracker-table.css">
  <link rel="stylesheet" href="css/tracker-code-lookup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <img src="logo.png" alt="DOLE Logo">
        OB Form Tracker
      </h1>
      <a href="/" class="back-link">← Back to Form</a>
    </div>
    
    <section class="ui-card code-lookup" aria-labelledby="codeLookupTitle">
      <h2 id="codeLookupTitle">Find your form by Reference code</h2>
      <form id="codeLookupForm" class="code-lookup-row" autocomplete="off">
        <input type="text" id="codeLookupInput" class="ui-input" aria-labelledby="codeLookupTitle" placeholder="Paste your Reference code, such as DOLECN1026K7QX" spellcheck="false" autocapitalize="characters">
        <button type="submit" id="codeLookupButton" class="ui-btn">Find form</button>
      </form>
      <div id="codeLookupResult" class="code-lookup-result" aria-live="polite"></div>
    </section>

    <div class="tracker-container">
      <div class="search-filter-container">
        <div class="search-box">
          <input type="text" id="searchInput" class="ui-input" aria-label="Search the tracker" placeholder="Search by Date, Purpose, Employee Names, or Destination..." autocomplete="off">
        </div>
      </div>
      <div class="table-wrapper" id="tableWrapper">
        <div class="loading" id="loading">Loading tracker data...</div>
        <table id="trackerTable" style="display: none;">
          <thead>
            <tr>
              <th>Date of OB</th>
              <th>Time of OB</th>
              <th>Name/Names of Employees</th>
              <th>Purpose</th>
              <th>Destination</th>
              <th>Date Filed</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="trackerBody">
          </tbody>
        </table>
      </div>
      
      <div class="pagination" id="pagination" style="display: none;">
        <div class="pagination-info" id="paginationInfo"></div>
        <div class="pagination-controls">
          <button type="button" class="btn-pagination ui-btn ui-btn--secondary" id="btnPrev" onclick="loadPage(currentPage - 1)">Previous</button>
          <button type="button" class="btn-pagination ui-btn ui-btn--secondary" id="btnNext" onclick="loadPage(currentPage + 1)">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/escape-html.js"></script>
  <script src="js/tracker-rows.js"></script>
  <script src="js/date-wording.js"></script>
  <script src="js/clock-math.js"></script>
  <script src="js/date-mode.js"></script>
  <script src="js/tracker-details.js"></script>
  <script src="js/edit-fragment.js"></script>
  <script src="js/tracker-code-lookup.js"></script>
  <script>
    TrackerCodeLookup.attach({
      form: document.getElementById('codeLookupForm'),
      input: document.getElementById('codeLookupInput'),
      result: document.getElementById('codeLookupResult'),
      button: document.getElementById('codeLookupButton'),
    });
  </script>
  <script>
    let currentPage = 1;
    let totalPages = 1;
    let allEntries = [];
    let filteredEntries = [];
    let searchTerm = '';

    // Search input handler
    document.getElementById('searchInput').addEventListener('input', function(e) {
      searchTerm = e.target.value.trim().toLowerCase();
      applyFilters();
    });

    function applyFilters() {
      filteredEntries = allEntries.filter(entry => {
        // Search filter - case-insensitive partial matching
        let matchesSearch = true;
        if (searchTerm) {
          const searchFields = [
            entry.dateOfOB || '',
            entry.timeOfOB || '',
            entry.employees || '',
            entry.purpose || '',
            entry.destination || ''
          ].join(' ').toLowerCase();
          matchesSearch = searchFields.includes(searchTerm);
        }

        return matchesSearch;
      });

      currentPage = 1;
      displayFilteredResults();
    }

    function displayFilteredResults() {
      const body = document.getElementById('trackerBody');
      const table = document.getElementById('trackerTable');
      const loading = document.getElementById('loading');
      const pagination = document.getElementById('pagination');

      if (filteredEntries.length === 0) {
        loading.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><p>No matching results found</p></div>';
        loading.style.display = 'block';
        table.style.display = 'none';
        pagination.style.display = 'none';
        return;
      }

      // Calculate pagination
      const itemsPerPage = 20;
      totalPages = Math.ceil(filteredEntries.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const pageEntries = filteredEntries.slice(startIndex, endIndex);

      // Populate table
      body.innerHTML = pageEntries.map(TrackerRows.rowHtml).join('');

      // Update pagination
      document.getElementById('paginationInfo').textContent = 
        `Page ${currentPage} of ${totalPages} (${filteredEntries.length} matching entries)`;
      document.getElementById('btnPrev').disabled = currentPage <= 1;
      document.getElementById('btnNext').disabled = currentPage >= totalPages;

      loading.style.display = 'none';
      table.style.display = 'table';
      pagination.style.display = 'flex';
    }

    async function loadPage(page) {
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      
      // If we have search applied, use filtered results
      if (searchTerm) {
        displayFilteredResults();
        return;
      }

      // Otherwise, load from server
      const loading = document.getElementById('loading');
      const table = document.getElementById('trackerTable');
      const body = document.getElementById('trackerBody');
      const pagination = document.getElementById('pagination');
      
      loading.style.display = 'block';
      table.style.display = 'none';
      pagination.style.display = 'none';
      body.innerHTML = '';
      
      try {
        const response = await fetch(`/api/tracker?page=${page}`);
        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error);
        }
        
        currentPage = data.pagination.currentPage;
        totalPages = data.pagination.totalPages;
        
        if (data.entries.length === 0) {
          loading.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><p>No OB forms found</p></div>';
          return;
        }

        // Store all entries for filtering
        if (page === 1) {
          allEntries = data.entries;
        } else {
          // For subsequent pages, we might need to load all data
          // For now, we'll work with what we have
          allEntries = data.entries;
        }
        filteredEntries = allEntries;
        
        // Populate table
        body.innerHTML = data.entries.map(TrackerRows.rowHtml).join('');
        
        // Update pagination
        document.getElementById('paginationInfo').textContent = 
          `Page ${currentPage} of ${totalPages} (${data.pagination.totalEntries} total entries)`;
        document.getElementById('btnPrev').disabled = !data.pagination.hasPrev;
        document.getElementById('btnNext').disabled = !data.pagination.hasNext;
        
        loading.style.display = 'none';
        table.style.display = 'table';
        pagination.style.display = 'flex';
        
      } catch (error) {
        console.error('Error loading tracker data:', error);
        loading.innerHTML = TrackerRows.errorHtml(error.message);
      }
    }

    // Load all data for filtering (using efficient single-query endpoint)
    async function loadAllData() {
      const loading = document.getElementById('loading');
      loading.style.display = 'block';
      
      try {
        // Use the /api/tracker/all endpoint for efficient single-query loading
        const response = await fetch('/api/tracker/all');
        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error);
        }
        
        allEntries = data.entries || [];
        filteredEntries = allEntries;
        applyFilters();
      } catch (error) {
        console.error('Error loading all tracker data:', error);
        // Fallback to paginated loading
        loadPage(1);
      }
    }
    
    function viewForm(id) {
      window.open(`/print/${id}`, '_blank');
    }
    
    // Load all data on page load for filtering
    loadAllData();
  </script>
</body>
</html>
